<app-data-table [columns]="cols" [dataSet]="dataSet()">
  <ng-template let-row>
    <div class="flex space-x-2">
      <app-button [disabled]="row.default" (clicked)="setAsDefault(row.name)" [variant]="'primary'"
        >✓</app-button
      >
      <app-button (clicked)="removeRecord(row.name)" [variant]="'error'">✗</app-button>
    </div>
  </ng-template>
</app-data-table>
<app-modal [isOpen]="modalIsOpen()" (modalClose)="closeModal()" [size]="'medium'">
  <h2 class="text-xl font-bold mb-4">Crear perfil de transferencia</h2>
  <div class="flex flex-col md:flex-row gap-4">
    <form class="w-full bg-white rounded-2xl shadow-lg p-6 space-y-4">
      <div class="flex flex-col">
        <label for="name" class="text-sm font-medium text-gray-600 mb-1">Nombre</label>
        <input
          [value]="name()"
          (input)="handleInput($event)"
          type="text"
          id="name"
          class="rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
      <div class="flex flex-col relative">
        <label for="co" class="text-sm font-medium text-gray-600 mb-1"
          >Credenciales del origen</label
        >
        <select
          id="co"
          (change)="onSourceChange($event)"
          class="appearance-none rounded-lg border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="" disabled selected>Seleccione una opción</option>
          @for (source of optionsSource(); track source.value.name) {
            <option [value]="source.value.name">{{ source.label }}</option>
          }
        </select>
        <span class="absolute right-3 top-9 pointer-events-none text-gray-400">
          <!-- Heroicon chevron-down -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </span>
      </div>

      <div class="flex flex-col relative">
        <label for="cd" class="text-sm font-medium text-gray-600 mb-1"
          >Credenciales del destino
        </label>
        <select
          id="cd"
          (change)="onTargetChange($event)"
          class="appearance-none rounded-lg border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="" disabled selected>Seleccione una opción</option>
          @for (source of optionsTarget(); track source.value.name) {
            <option [value]="source.value.name">{{ source.label }}</option>
          }
        </select>
        <span class="absolute right-3 top-9 pointer-events-none text-gray-400">
          <!-- Heroicon chevron-down -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </span>
      </div>
      <div class="flex flex-col">
        <label for="so" class="text-sm font-medium text-gray-600 mb-1">Servidor origen</label>
        <input
          [value]="sourceLabel()"
          type="text"
          name=""
          id="so"
          class="rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
      <div class="flex flex-col">
        <label for="sd" class="text-sm font-medium text-gray-600 mb-1">Servidor destino</label>
        <input
          [value]="targetLabel()"
          type="text"
          name=""
          id="sd"
          class="rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
      <div class="pt-2">
        <app-button [type]="'button'" (clicked)="save($event)" class="w-full">Guardar</app-button>
      </div>
    </form>
  </div>
</app-modal>
<app-button (clicked)="openAddModal()">Crear perfil</app-button>
